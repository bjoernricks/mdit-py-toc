[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdit-py-toc"
version = "1.0.1.dev1"
description = "A table of contents (TOC) plugin for markdown-it-py"
authors = [{ name = "Björn Ricks", email = "bjoern.ricks@greenbone.net" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["markdown-it-py>=3.0.0"]

[project.urls]
Homepage = "https://github.com/bjoernricks/mdit-py-toc"
Repository = "https://github.com/bjoernricks/mdit-py-toc/"

[dependency-groups]
dev = [
    "autohooks-plugin-ruff>=24.1.0",
    "autohooks-plugin-mypy>=23.10.0",
    "autohooks-plugin-black>=23.10.0",
    "pontos>=24.1.2",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.wheel]
packages = ["mdit_py_toc"]

[tool.hatch.build.targets.sdist]
include = ["tests", "mdit_py_toc", "uv.lock"]

[tool.ruff]
line-length = 80
target-version = "py39"

[tool.ruff.lint]
extend-select = ["I", "PLE", "PLW", "PTH", "C4", "A", "N", "RUF", "UP"]

[tool.mypy]
files = "mdit_py_toc"
ignore_missing_imports = true
explicit_package_bases = true
allow_redefinition = true

[tool.black]
line-length = 80
target-version = ["py39", "py310", "py311", "py312"]

[tool.autohooks]
mode = "poetry"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.mypy",
    "autohooks.plugins.ruff",
]

[tool.pontos.version]
version-module-file = "mdit_py_toc/__version__.py"
