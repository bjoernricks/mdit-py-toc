name: Deploy on PyPI

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mdit-py-toc/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: greenbone/actions/uv@v3.36.12
        with:
          python-version: "3.10"
      - name: Build
        run: |
          uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
