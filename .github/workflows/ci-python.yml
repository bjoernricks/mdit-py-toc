name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    name: Linting
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Lint with ruff
        uses: greenbone/actions/lint-python@v3.36.12
        with:
          packages: mdit_py_toc tests
          package-manager: uv
          python-version: ${{ matrix.python-version }}
          linter: ruff check --diff

  test:
    name: Run all tests
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Install python and and uv
        uses: greenbone/actions/uv@v3.36.12
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: uv run python -m unittest -v

  mypy:
    name: Check type hints
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: greenbone/actions/uv@v3.36.12
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run mypy
        run: uv run mypy mdit_py_toc tests

  check-version:
    name: Check versioning for consistency
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Install python and uv
        uses: greenbone/actions/uv@v3.36.12
      - name: Check version
        run: |
          uv run pontos-version verify current
